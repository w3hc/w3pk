name: Contracts

on:
  push:
    branches: [main]
    paths: ["contracts/**", ".github/workflows/contracts.yml", ".gitmodules"]
  pull_request:
    branches: [main]
    paths: ["contracts/**", ".github/workflows/contracts.yml", ".gitmodules"]

defaults:
  run:
    working-directory: contracts

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Format
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv --gas-report

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: crytic/slither-action@v0.4.1
        with:
          target: contracts
          fail-on: medium
