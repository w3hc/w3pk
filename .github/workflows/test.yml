name: Test and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install circom
        env:
          CIRCOM_VERSION: v2.2.3
          CIRCOM_SHA256: 85342c7ff332d948df7c0c50ecf201e6129349aef550ce873f3c811b79fe53a3
        run: |
          mkdir -p "$RUNNER_TEMP/circom"
          curl -fsSL -o "$RUNNER_TEMP/circom/circom" "https://github.com/iden3/circom/releases/download/$CIRCOM_VERSION/circom-linux-amd64"
          echo "$CIRCOM_SHA256  $RUNNER_TEMP/circom/circom" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/circom/circom"
          echo "$RUNNER_TEMP/circom" >> "$GITHUB_PATH"

      - name: Run all tests
        run: pnpm test
